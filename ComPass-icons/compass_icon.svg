<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0D0D1A;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="needleN" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#D946EF"/>
      <stop offset="100%" style="stop-color:#F0ABFC"/>
    </linearGradient>
    <linearGradient id="needleS" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#6432C8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#0D0D1A"/>

  <!-- Subtle radial glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.5"/>

  <!-- Tick marks - Cardinal -->
  <g stroke="#D946EF" stroke-width="2.5" opacity="0.85">
    <line x1="256" y1="65" x2="256" y2="85"/>
    <line x1="447" y1="256" x2="427" y2="256"/>
    <line x1="256" y1="447" x2="256" y2="427"/>
    <line x1="65" y1="256" x2="85" y2="256"/>
  </g>

  <!-- Tick marks - Intercardinal -->
  <g stroke="#8B5CF6" stroke-width="1.5" opacity="0.7" transform="rotate(45 256 256)">
    <line x1="256" y1="68" x2="256" y2="82"/>
    <line x1="444" y1="256" x2="430" y2="256"/>
    <line x1="256" y1="444" x2="256" y2="430"/>
    <line x1="68" y1="256" x2="82" y2="256"/>
  </g>

  <!-- Minor tick marks -->
  <g stroke="#9CA3AF" stroke-width="1" opacity="0.3">
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(15 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(30 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(60 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(75 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(105 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(120 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(150 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(165 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(195 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(210 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(240 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(255 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(285 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(300 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(330 256 256)"/>
    <line x1="256" y1="63" x2="256" y2="72" transform="rotate(345 256 256)"/>
  </g>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="154" fill="none" stroke="#252542" stroke-width="1" opacity="0.7"/>

  <!-- Compass needle - rotated -35 degrees for dynamic look -->
  <g transform="rotate(-35 256 256)" filter="url(#glow)">
    <!-- South half (purple) -->
    <polygon points="256,394 225,256 256,256" fill="url(#needleS)" opacity="0.7"/>
    <polygon points="256,394 287,256 256,256" fill="#6432C8" opacity="0.6"/>

    <!-- North half (magenta) -->
    <polygon points="256,118 225,256 256,256" fill="url(#needleN)"/>
    <polygon points="256,118 287,256 256,256" fill="#BE32D2" opacity="0.9"/>
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="white" stroke="#D946EF" stroke-width="2"/>

  <!-- CP text -->
  <text x="256" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="300" fill="white" opacity="0.55" letter-spacing="6">CP</text>
</svg>