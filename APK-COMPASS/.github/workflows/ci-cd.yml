name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'APK-COMPASS/**'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip Render deploy'
        required: false
        default: 'false'

env:
  WORKING_DIR: APK-COMPASS
  RENDER_SERVICE_ID: srv-d6onpd450q8c73cdaf8g
  APP_URL: https://compass-blql.onrender.com

jobs:
  # ── Step 1: TypeScript & Build Check ──
  build-check:
    name: TypeScript & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKING_DIR }}

      - name: Next.js build
        run: npx next build
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Build success summary
        run: |
          echo "## Build Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: OK" >> $GITHUB_STEP_SUMMARY
          echo "- Next.js build: OK" >> $GITHUB_STEP_SUMMARY

  # ── Step 2: Trigger Render Deploy ──
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event.inputs.skip_deploy != 'true'
    timeout-minutes: 15
    steps:
      - name: Trigger deploy
        id: trigger
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id // .deploy.id // empty')
            echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
            echo "Deploy triggered: $DEPLOY_ID"
          else
            echo "::error::Deploy trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Wait for deploy
        if: steps.trigger.outputs.deploy_id != ''
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          echo "Waiting for deploy $DEPLOY_ID..."

          for i in $(seq 1 60); do
            sleep 15

            STATUS_RESPONSE=$(curl -s \
              "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // "unknown"')
            echo "Attempt $i: Status = $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deploy is LIVE!"
              echo "## Deploy Successful" >> $GITHUB_STEP_SUMMARY
              echo "- Deploy ID: $DEPLOY_ID" >> $GITHUB_STEP_SUMMARY
              echo "- URL: ${{ env.APP_URL }}" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            if [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::Deploy failed with status: $STATUS"
              exit 1
            fi
          done

          echo "::warning::Deploy timeout (15 min). Check Render dashboard."
          exit 1

  # ── Step 3: Smoke Test ──
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Check app is responding
        run: |
          echo "Testing ${{ env.APP_URL }}..."

          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ env.APP_URL }}/login" --max-time 30)
            echo "Attempt $i: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "App is responding!"
              echo "## Smoke Test Passed" >> $GITHUB_STEP_SUMMARY
              echo "- Login page: HTTP 200" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            sleep 10
          done

          echo "::error::App not responding after 5 attempts"
          exit 1

      - name: Check API health
        run: |
          # Test that Supabase connection works via app
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ env.APP_URL }}/api/health" --max-time 15 || echo "404")
          echo "Health endpoint: HTTP $HTTP_CODE"

          # Even if /api/health doesn't exist (404), the app is running
          if [ "$HTTP_CODE" != "000" ]; then
            echo "Server is reachable."
          else
            echo "::warning::Server not reachable"
          fi
