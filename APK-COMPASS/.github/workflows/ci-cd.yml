name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'APK-COMPASS/**'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip Render deploy'
        required: false
        default: 'false'

env:
  WORKING_DIR: APK-COMPASS
  RENDER_SERVICE_ID: srv-d6onpd450q8c73cdaf8g
  APP_URL: https://compass-blql.onrender.com

jobs:
  # ── Step 1: TypeScript & Build Check ──
  build-check:
    name: TypeScript & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ${{ env.WORKING_DIR }}

      - name: Next.js build
        run: npx next build
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Build success summary
        run: |
          echo "## Build Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: OK" >> $GITHUB_STEP_SUMMARY
          echo "- Next.js build: OK" >> $GITHUB_STEP_SUMMARY

  # ── Step 2: Trigger Render Deploy ──
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event.inputs.skip_deploy != 'true'
    timeout-minutes: 15
    steps:
      - name: Trigger deploy
        id: trigger
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id // .deploy.id // empty')
            echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
            echo "Deploy triggered: $DEPLOY_ID"
          else
            echo "::error::Deploy trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Wait for deploy
        if: steps.trigger.outputs.deploy_id != ''
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          echo "Waiting for deploy $DEPLOY_ID..."

          for i in $(seq 1 60); do
            sleep 15

            STATUS_RESPONSE=$(curl -s \
              "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // "unknown"')
            echo "Attempt $i: Status = $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deploy is LIVE!"
              echo "## Deploy Successful" >> $GITHUB_STEP_SUMMARY
              echo "- Deploy ID: $DEPLOY_ID" >> $GITHUB_STEP_SUMMARY
              echo "- URL: ${{ env.APP_URL }}" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            if [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::Deploy failed with status: $STATUS"
              exit 1
            fi
          done

          echo "::warning::Deploy timeout (15 min). Check Render dashboard."
          exit 1

  # ── Step 3: Smoke Test ──
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - name: Wait for app to be ready
        run: |
          echo "Testing ${{ env.APP_URL }}..."
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ env.APP_URL }}/login" --max-time 30)
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "App is responding!"
              exit 0
            fi
            sleep 15
          done
          echo "::error::App not responding after 10 attempts"
          exit 1

      - name: Test public pages
        run: |
          PASS=0; FAIL=0
          for PAGE in "/login" "/privacy-policy" "/terms"; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ env.APP_URL }}$PAGE" --max-time 15)
            if [ "$HTTP" = "200" ]; then
              echo "✅ $PAGE — HTTP $HTTP"
              PASS=$((PASS + 1))
            else
              echo "❌ $PAGE — HTTP $HTTP"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "Pages: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Test Supabase auth (admin login)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}" \
            --max-time 15)

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          if [ -n "$TOKEN" ]; then
            echo "✅ Admin login successful (token: ${#TOKEN} chars)"
            echo "access_token=$TOKEN" >> $GITHUB_OUTPUT
          else
            ERROR=$(echo "$RESPONSE" | jq -r '.error_description // .msg // "unknown"')
            echo "❌ Admin login failed: $ERROR"
            exit 1
          fi
        id: auth

      - name: Test Supabase data access (profiles + loyalty)
        if: steps.auth.outputs.access_token != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"

          # Test profiles
          PROFILES=$(curl -s \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=5" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $TOKEN" --max-time 10)
          COUNT=$(echo "$PROFILES" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "✅ Profiles accessible: $COUNT records"
          else
            echo "❌ No profiles returned"
            exit 1
          fi

          # Test loyalty_transactions
          TX=$(curl -s \
            "$SUPABASE_URL/rest/v1/loyalty_transactions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $TOKEN" --max-time 10)
          TX_OK=$(echo "$TX" | jq 'if type == "array" then "yes" else "no" end' -r)
          if [ "$TX_OK" = "yes" ]; then
            echo "✅ Loyalty transactions table accessible"
          else
            echo "⚠️ Loyalty transactions: $(echo "$TX" | jq -r '.message // "unknown error"')"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- App URL: ${{ env.APP_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Login page: tested" >> $GITHUB_STEP_SUMMARY
          echo "- Public pages: tested" >> $GITHUB_STEP_SUMMARY
          echo "- Supabase auth: tested" >> $GITHUB_STEP_SUMMARY
          echo "- Data access: tested" >> $GITHUB_STEP_SUMMARY

  # ── Step 4: Playwright E2E Tests ──
  e2e-tests:
    name: E2E Browser Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: ${{ env.WORKING_DIR }}
        env:
          BASE_URL: ${{ env.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ env.WORKING_DIR }}/playwright-report/
            ${{ env.WORKING_DIR }}/test-results/
          retention-days: 7

      - name: E2E summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Browser: Chromium" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ env.APP_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Smoke, Auth, Communicator, RLS, Loyalty" >> $GITHUB_STEP_SUMMARY

  # ── Step 5: Auto-Diagnosis & Issue Creation ──
  diagnose:
    name: Diagnose & Report
    runs-on: ubuntu-latest
    needs: [build-check, deploy, smoke-test, e2e-tests]
    if: failure()
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Collect failure context
        id: diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Analyzing pipeline failure..."

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          BRANCH="${{ github.ref_name }}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          # ── Determine which jobs failed ──
          FAILED_JOBS=""
          BUILD_STATUS="${{ needs.build-check.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          SMOKE_STATUS="${{ needs.smoke-test.result }}"
          E2E_STATUS="${{ needs.e2e-tests.result }}"

          [ "$BUILD_STATUS" = "failure" ] && FAILED_JOBS="$FAILED_JOBS build-check"
          [ "$DEPLOY_STATUS" = "failure" ] && FAILED_JOBS="$FAILED_JOBS deploy"
          [ "$SMOKE_STATUS" = "failure" ] && FAILED_JOBS="$FAILED_JOBS smoke-test"
          [ "$E2E_STATUS" = "failure" ] && FAILED_JOBS="$FAILED_JOBS e2e-tests"

          # ── Classify failure category ──
          CATEGORY="unknown"
          SEVERITY="medium"
          ICON="🟡"

          if echo "$FAILED_JOBS" | grep -q "build-check"; then
            CATEGORY="BUILD"
            SEVERITY="critical"
            ICON="🔴"
            DIAGNOSIS="Kod nie kompiluje się. Prawdopodobnie błąd TypeScript lub brakujące zależności."
            FIX_PROPOSAL="1. Sprawdź logi TypeScript w Actions → build-check → TypeScript check
          2. Uruchom lokalnie: \`cd APK-COMPASS && npx tsc --noEmit\`
          3. Napraw błędy typu → commit → push"
            PRIORITY="P0 — blokuje deploy"

          elif echo "$FAILED_JOBS" | grep -q "deploy"; then
            CATEGORY="DEPLOY"
            SEVERITY="critical"
            ICON="🔴"
            DIAGNOSIS="Deploy na Render nie powiódł się. Możliwe przyczyny: timeout, błąd runtime, brak zmiennych środowiskowych."
            FIX_PROPOSAL="1. Sprawdź Render Dashboard: https://dashboard.render.com
          2. Sprawdź logi serwisu: Events → Latest deploy
          3. Zweryfikuj zmienne środowiskowe w Render → Environment
          4. Jeśli timeout — prawdopodobnie cold start Render Free Tier"
            PRIORITY="P0 — aplikacja nie działa"

          elif echo "$FAILED_JOBS" | grep -q "smoke-test"; then
            CATEGORY="SMOKE"
            SEVERITY="high"
            ICON="🟠"
            DIAGNOSIS="Aplikacja się wdrożyła, ale testy bazowe nie przeszły. Możliwe: strona nie odpowiada, błąd auth Supabase, problem z danymi."
            FIX_PROPOSAL="1. Sprawdź czy ${{ env.APP_URL }}/login odpowiada (otwórz w przeglądarce)
          2. Sprawdź Supabase Dashboard → Authentication → Users
          3. Zweryfikuj czy konto testowe istnieje i hasło jest aktualne
          4. Sprawdź RLS policies w Supabase → Table Editor"
            PRIORITY="P1 — deploy OK ale funkcjonalność zepsuta"

          elif echo "$FAILED_JOBS" | grep -q "e2e-tests"; then
            CATEGORY="E2E"
            SEVERITY="medium"
            ICON="🟡"
            DIAGNOSIS="Deploy i smoke testy OK, ale testy przeglądarkowe wykryły problem UI. Może to być zmiana layoutu, brakujący element, timeout lub flaky test."
            FIX_PROPOSAL="1. Pobierz raport Playwright z Artifacts (zakładka Actions → Artifacts)
          2. Sprawdź screenshoty z momentu błędu
          3. Otwórz trace viewer: \`npx playwright show-trace trace.zip\`
          4. Jeśli test jest flaky (przechodzi czasem) — rozważ zwiększenie timeout
          5. Jeśli UI się zmienił — zaktualizuj selektory w e2e/*.spec.ts"
            PRIORITY="P2 — app działa, ale UX regresja"
          fi

          # ── Save to outputs ──
          {
            echo "category=$CATEGORY"
            echo "severity=$SEVERITY"
            echo "icon=$ICON"
            echo "priority=$PRIORITY"
            echo "failed_jobs=$FAILED_JOBS"
          } >> $GITHUB_OUTPUT

          # ── Save multiline outputs via files ──
          echo "$DIAGNOSIS" > /tmp/diagnosis.txt
          echo "$FIX_PROPOSAL" > /tmp/fix_proposal.txt

          # ── Save metadata ──
          {
            echo "run_url=$RUN_URL"
            echo "commit_sha=$COMMIT_SHA"
            echo "branch=$BRANCH"
            echo "timestamp=$TIMESTAMP"
          } >> $GITHUB_OUTPUT

          echo "commit_msg<<EOFMSG" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOFMSG" >> $GITHUB_OUTPUT

          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT

      - name: Create diagnostic GitHub Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIAGNOSIS=$(cat /tmp/diagnosis.txt)
          FIX_PROPOSAL=$(cat /tmp/fix_proposal.txt)

          TITLE="${{ steps.diagnosis.outputs.icon }} Pipeline FAIL [${{ steps.diagnosis.outputs.category }}] — ${{ steps.diagnosis.outputs.priority }}"

          BODY=$(cat <<'HEREDOC_END'
          ## ${{ steps.diagnosis.outputs.icon }} Pipeline Failure Report

          | | |
          |---|---|
          | **Kategoria** | ${{ steps.diagnosis.outputs.category }} |
          | **Priorytet** | ${{ steps.diagnosis.outputs.priority }} |
          | **Severity** | ${{ steps.diagnosis.outputs.severity }} |
          | **Branch** | `${{ steps.diagnosis.outputs.branch }}` |
          | **Commit** | `${{ steps.diagnosis.outputs.commit_sha }}` |
          | **Autor** | ${{ steps.diagnosis.outputs.commit_author }} |
          | **Czas** | ${{ steps.diagnosis.outputs.timestamp }} |

          ### Commit message
          ```
          ${{ steps.diagnosis.outputs.commit_msg }}
          ```

          ### Diagnoza
          HEREDOC_END

          BODY="$BODY
          $DIAGNOSIS

          ### Proponowana naprawa
          $FIX_PROPOSAL

          ### Status jobów
          | Job | Status |
          |-----|--------|
          | TypeScript & Build | \`${{ needs.build-check.result }}\` |
          | Deploy to Render | \`${{ needs.deploy.result }}\` |
          | Smoke Test | \`${{ needs.smoke-test.result }}\` |
          | E2E Browser Tests | \`${{ needs.e2e-tests.result }}\` |

          ### Linki
          - [Pipeline Run](${{ steps.diagnosis.outputs.run_url }})
          - [Aplikacja](${{ env.APP_URL }})
          - [Render Dashboard](https://dashboard.render.com)

          ---
          > **Decyzja należy do Ciebie.** Ten issue zawiera automatyczną diagnozę i propozycję naprawy.
          > Zamknij issue po naprawie lub dodaj komentarz z decyzją.
          >
          > 🤖 _Wygenerowane automatycznie przez CI/CD Pipeline_"

          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "bug,ci-cd,auto-diagnosis" \
            --assignee "biurko2015-eng" 2>/dev/null || \

          gh issue create \
            --title "$TITLE" \
            --body "$BODY" 2>/dev/null || \

          echo "::warning::Could not create issue (labels may not exist). Check permissions."

      - name: Send email notification
        run: |
          echo "## 📧 Notification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failure detected in pipeline.**" >> $GITHUB_STEP_SUMMARY
          echo "- Category: ${{ steps.diagnosis.outputs.category }}" >> $GITHUB_STEP_SUMMARY
          echo "- Severity: ${{ steps.diagnosis.outputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "- Priority: ${{ steps.diagnosis.outputs.priority }}" >> $GITHUB_STEP_SUMMARY
          echo "- Failed jobs: ${{ steps.diagnosis.outputs.failed_jobs }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 GitHub Issue created with diagnosis and fix proposal." >> $GITHUB_STEP_SUMMARY
          echo "✋ **Awaiting your decision — no automatic changes will be made.**" >> $GITHUB_STEP_SUMMARY
