name: E2E & RLS Tests

on:
  # DISABLED — replaced by ci-cd.yml pipeline
  # Old workflow references non-existent ak-qualrix/ directory
  # Re-enable when E2E tests are migrated to APK-COMPASS/
  workflow_dispatch:

env:
  BASE_URL: https://compass-14fg.onrender.com
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

jobs:
  # --- RLS & API Tests (fast, no browser needed) ---
  rls-tests:
    name: RLS Policy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ak-qualrix/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ak-qualrix

      - name: Run RLS tests
        run: npx playwright test e2e/04-rls-database.spec.ts --reporter=github
        working-directory: ak-qualrix

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-test-results
          path: ak-qualrix/test-results/
          retention-days: 7

  # --- E2E Browser Tests ---
  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ak-qualrix/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ak-qualrix

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: ak-qualrix

      - name: Run E2E smoke tests
        run: npx playwright test e2e/01-smoke.spec.ts --reporter=github
        working-directory: ak-qualrix

      - name: Run E2E auth tests
        run: npx playwright test e2e/02-auth.spec.ts --reporter=github
        working-directory: ak-qualrix

      - name: Run E2E communicator tests
        run: npx playwright test e2e/03-communicator.spec.ts --reporter=github
        working-directory: ak-qualrix

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            ak-qualrix/test-results/
            ak-qualrix/playwright-report/
          retention-days: 7

  # --- Notification on failure ---
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [rls-tests, e2e-tests]
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "::error::E2E or RLS tests failed! Check the test artifacts for details."
          echo "## Test Failure Report" >> $GITHUB_STEP_SUMMARY
          echo "One or more test suites failed after deployment." >> $GITHUB_STEP_SUMMARY
          echo "### What to check:" >> $GITHUB_STEP_SUMMARY
          echo "- RLS policies on Supabase (conversations, profiles, messages)" >> $GITHUB_STEP_SUMMARY
          echo "- Auth flow (login, MFA, redirect)" >> $GITHUB_STEP_SUMMARY
          echo "- Server actions returning proper errors" >> $GITHUB_STEP_SUMMARY
