services:
  - type: web
    name: compass-14fg
    runtime: node
    rootDir: APK-COMPASS
    repo: https://github.com/biurko2015-eng/aplikacja-zbyszka.git
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node .next/standalone/server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
